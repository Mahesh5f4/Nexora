name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Validate Maven project
        run: ./mvnw validate

      - name: Build, Test, and Generate Coverage
        run: ./mvnw verify

      - name: Output Total Coverage Percentage
        if: always()
        run: |
          if [ -f "coverage-report/target/site/jacoco-aggregate/jacoco.csv" ]; then
            awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print "Total Coverage: " 100*covered/instructions "%" }' coverage-report/target/site/jacoco-aggregate/jacoco.csv
          else
            echo "Coverage report not found."
          fi
        shell: bash

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/coverage-report/target/site/jacoco-aggregate/
          retention-days: 14
