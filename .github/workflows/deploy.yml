name: CD Pipeline - Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY
          script: |
            # Navigate to the project directory
            cd /home/ubuntu/Nexora
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Inject GEMINI API KEY into backend/.env (where docker-compose runs)
            touch backend/.env
            if grep -q "GEMINI_API_KEY" backend/.env; then
              sed -i "s/^GEMINI_API_KEY=.*/GEMINI_API_KEY=$GEMINI_API_KEY/" backend/.env
            else
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> backend/.env
            fi
            
            # Navigate to the backend directory where docker-compose lives
            cd backend
            
            # Rebuild all images and recreate containers in detached mode
            sudo docker compose up -d --build
            
            # Remove any dangling or unused Docker images to free up space
            sudo docker image prune -f
