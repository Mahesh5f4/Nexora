name: Exhaustive QA Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  build-and-unit-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and Unit Test
        working-directory: ./backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean test -DskipIntegrationTests=true
      - name: Cache local Maven repository
        uses: actions/cache@v3
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Integration Tests
        working-directory: ./backend
        run: |
          chmod +x ./mvnw
          ./mvnw verify -P integration-tests

  docker-tests:
    name: Docker Infrastructure Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - name: Build and Start Containers
        working-directory: ./backend
        run: |
          docker compose build
          docker compose up -d
      - name: Wait for Health Checks
        working-directory: ./backend
        run: |
          echo "Waiting for services to become healthy..."
          sleep 45
          docker compose ps
      - name: Verify Nginx Routing
        run: |
          curl -f -k http://localhost/api/events || exit 1
      - name: Teardown
        working-directory: ./backend
        if: always()
        run: docker compose down -v

  performance-smoke-test:
    name: k6 Performance Smoke Test
    runs-on: ubuntu-latest
    needs: docker-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Start Infrastructure
        working-directory: ./backend
        run: |
          docker compose up -d
          sleep 45
      - name: Run k6 Load Test
        run: |
          k6 run --vus 10 --duration 10s k6/smoke-test.js || echo "No smoke test script found yet"
      - name: Teardown
        working-directory: ./backend
        if: always()
        run: docker compose down -v

  final-report:
    name: QA Status
    runs-on: ubuntu-latest
    needs: [integration-tests, docker-tests, performance-smoke-test]
    if: always()
    steps:
      - name: Final Pipeline Status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Pipeline Failed! Check upstream jobs."
            exit 1
          else
            echo "All Exhaustive QA Tests Passed."
          fi
