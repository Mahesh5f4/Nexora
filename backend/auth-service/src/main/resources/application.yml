spring:
  application:
    name: auth-service
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexora}
    username: ${SPRING_DATASOURCE_USERNAME:nexora}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuthSystemHikariPool
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000
      leak-detection-threshold: 10000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
  
  cache:
    type: redis
    redis:
      time-to-live: 300000
  
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:your_sendinblue_email@example.com}
    password: ${SPRING_MAIL_PASSWORD:your_sendinblue_api_key}
    from: ${SPRING_MAIL_FROM:mahesh20104@gmail.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5, 0.9, 0.95, 0.99
    export:
      prometheus:
        enabled: true

logging:
  level:
    org.springframework.security: DEBUG

google:
  client:
    id: ${GOOGLE_CLIENT_ID:584418196078-qt77vi3grcjed1c87c79bl0bto665cpq.apps.googleusercontent.com}

brevo:
  api:
    key: ${BREVO_API_KEY:your_brevo_api_key}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

ai:
  service:
    url: ${AI_SERVICE_URL:https://thinkaction-ai.onrender.com}
  internal:
    token: ${AI_INTERNAL_TOKEN:${AI_SERVICE_INTERNAL_TOKEN:super-secret-dev-token}}
  conversation:
    max-context-messages: ${AI_CONVERSATION_MAX_CONTEXT_MESSAGES:10}

admin:
  email: ${ADMIN_EMAIL:thinkactionai@admin.com}
  password: ${ADMIN_PASSWORD:admin123}

