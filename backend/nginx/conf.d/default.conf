# =============================================================
# Nginx — HTTPS Server Block (SSL)
# =============================================================

server {
    listen 80;
    server_name 16-192-164-81.nip.io;
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 16-192-164-81.nip.io;

    ssl_certificate /etc/letsencrypt/live/16-192-164-81.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16-192-164-81.nip.io/privkey.pem;

    # ─── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()" always;

    # ─── CORS Headers (applied to every response) ─────────────
    add_header Access-Control-Allow-Origin      "$http_origin"  always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # ─── Health Check ─────────────────────────────────────────
    location = /health {
        access_log  off;
        return 200  "healthy\n";
        add_header  Content-Type text/plain;
    }

    # ─── API Routes (Proxy to Gateway) ────────────────────────
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      "$http_origin" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Length 0;
            return 204;
        }

        # Rate limiting
        limit_req   zone=api burst=50 nodelay;
        limit_conn  conn_limit 20;

        # Docker internal DNS resolver for dynamic IP updates
        resolver 127.0.0.11 valid=10s;
        set $upstream_backend http://backend:8081;
        proxy_pass $upstream_backend;
        
        proxy_http_version  1.1;

        # Strip CORS headers from upstream to avoid duplicates (gateway adds them)
        proxy_hide_header   Access-Control-Allow-Origin;
        proxy_hide_header   Access-Control-Allow-Methods;
        proxy_hide_header   Access-Control-Allow-Headers;
        proxy_hide_header   Access-Control-Allow-Credentials;

        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_set_header    Connection          "";

        proxy_connect_timeout   60s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;

        proxy_buffering         off;
        proxy_buffer_size       4k;
        proxy_buffers           8 4k;
    }
}
