# =============================================================
# Nginx — Main Configuration
# =============================================================

user  nginx;
worker_processes  auto;               # One worker per CPU core

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;        # Efficient I/O on Linux
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Security: don't expose nginx version
    server_tokens off;

    # File upload limit (adjust if your app handles large files/images)
    client_max_body_size 20M;

    # ─── Gzip Compression ───────────────────────────────────────
    gzip              on;
    gzip_disable      "msie6";
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Rate Limiting ──────────────────────────────────────────
    # 30 requests/sec per IP on the API zone
    limit_req_zone  $binary_remote_addr  zone=api:10m  rate=30r/s;
    # Max 20 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # Include server blocks from conf.d/
    include /etc/nginx/conf.d/*.conf;
}
