<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Cyan Glow Gradient for T -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Violet/Magenta Gradient for A -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Bolt Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Ambient Glow Spheres in Background -->
  <circle cx="160" cy="220" r="90" fill="#00f0ff" opacity="0.12" filter="blur(30px)"/>
  <circle cx="340" cy="270" r="90" fill="#d946ef" opacity="0.14" filter="blur(30px)"/>

  <!-- Monogram Letter "T" (Think) -->
  <g filter="url(#neonCyan)">
    <!-- T Top Bar -->
    <path d="M 104 152 L 276 152 L 276 196 L 216 196 L 216 360 L 164 360 L 164 196 L 104 196 Z" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 104 152 L 276 152 L 276 196 L 216 196 L 216 360 L 164 360 L 164 196 L 104 196 Z" 
          fill="#00f0ff" fill-opacity="0.08"/>
  </g>

  <!-- Monogram Letter "A" (Action) -->
  <g filter="url(#neonViolet)">
    <!-- A Outline -->
    <path d="M 284 360 L 350 152 L 408 360 L 358 360 L 344 312 L 306 312 L 298 338 Z" 
          fill="none" stroke="url(#violetGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Inner Crossbar / Negative space -->
    <polygon points="348,198 322,282 374,282" fill="none" stroke="url(#violetGrad)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 284 360 L 350 152 L 408 360 L 358 360 L 344 312 L 306 312 L 298 338 Z" 
          fill="#d946ef" fill-opacity="0.08"/>
  </g>

  <!-- Neural Network Nodes & Links (Connecting T and A) -->
  <g opacity="0.85" stroke="#38bdf8" stroke-width="3">
    <line x1="216" y1="240" x2="252" y2="216" stroke-dasharray="4,4"/>
    <line x1="216" y1="280" x2="260" y2="280"/>
    <line x1="260" y1="280" x2="295" y2="245"/>
    <line x1="252" y1="216" x2="288" y2="200"/>
    
    <circle cx="216" cy="240" r="5" fill="#00f0ff"/>
    <circle cx="252" cy="216" r="6" fill="#38bdf8"/>
    <circle cx="260" cy="280" r="7" fill="#a855f7"/>
    <circle cx="288" cy="200" r="5" fill="#c084fc"/>
    <circle cx="295" cy="245" r="5" fill="#e879f9"/>
  </g>

  <!-- Action Spark / Dynamic Lightning Bolt in the Center -->
  <g filter="url(#boltGlow)">
    <polygon points="266,170 234,264 274,264 246,350 304,244 264,244" 
             fill="url(#boltGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>